services:
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    environment:
      PORT: "8080"
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: ./docker/server/Dockerfile
    environment:
      PORT: "8081"
    ports:
      - "${API_PORT:-8081}:8081"
    restart: unless-stopped
